<main class="dashboard-content">
    <div class="container-fluid px-3 px-lg-4 py-4">
        <div class="page-heading mb-4">
            <h1 class="h3 mb-1">Editar Actividad</h1>
            <p class="text-muted">Modifica una actividad ya existente.</p>
        </div>

        <section class="row">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form (ngSubmit)="onSubmit()">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre de la actividad</label>
                                <input type="text" class="form-control" [(ngModel)]="nombre_actividad" name="nombre" required placeholder="Ej. Proyecto de Probabilidad">
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Fecha de entrega</label>
                                <input type="date" class="form-control" [(ngModel)]="fecha_entrega" name="fecha" required>
                            </div>

                            <div class="mb-4 p-3 bg-black rounded">
                                <label class="form-label fw-semibold d-flex justify-content-between align-items-center">
                                    <span>Nivel de estrés esperado</span>
                                    <span class="badge bg-primary fs-6">{{ nivel_estres }}</span>
                                </label>
                                <input type="range" class="form-range" min="1" max="10" step="1" [(ngModel)]="nivel_estres" name="estres">
                                <div class="d-flex justify-content-between text-muted small mt-1">
                                    <span>1</span>
                                    <span>10</span>
                                </div>
                            </div>

                            <div class = "mb-4">
                                <label class="form-label fw-semibold">¿Ya la has completado?</label>
                                <input type="checkbox" class="form-check" [(ngModel)]="completada" name="completada" required>
                            </div>

                            @if (message()) {
                                <div class="alert alert-danger p-2 small mb-3">{{ message() }}</div>
                            }

                            <div class="d-flex gap-2 justify-content-end mt-4">
                                <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">Cancelar</button>
                                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
