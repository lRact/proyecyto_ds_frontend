<div class="auth-body">
    <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">
        <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
    </button>
    <main class="auth-page">
        <section class="auth-card">
            <a class="auth-brand" href="index.html"><span class="brand-icon"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i></span><span><strong>SAES</strong><small>Crear tu cuenta en SAES</small></span></a>
            <div class="auth-visual"><img src="../assets/images/png/dasher-ui-bootstrap-5.jpg" alt="adminHMD dashboard interface"></div>
            <form class="needs-validation" novalidate>
                <div class="mb-4">
                    <p class="eyebrow mb-1">Acceso Seguro</p>
                    <h1 class="h3 mb-1">Registro</h1>
                    <p class="text-muted mb-0">Crear tu cuenta en el SAES</p>
                </div>
                <div class="mb-3"><label class="form-label" for="registerName">Nombre Completo</label><input class="form-control" id="registerName" type="text" required><div class="invalid-feedback">Nombre completo es requerido</div></div>
                <div class="mb-3"><label class="form-label" for="registerEmail">Direccion de correo</label><input class="form-control" id="registerEmail" type="email" required><div class="invalid-feedback">Ingrese un correo valido</div></div>
                <div class="mb-3"><label class="form-label" for="registerPassword">Contraseña</label><input class="form-control" id="registerPassword" type="password" minlength="6" required><div class="invalid-feedback">La contraseña debe de tener minimo 6 caracteres</div></div>
                <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="terms" required><label class="form-check-label" for="terms">Acepto los terminos y condiciones</label><div class="invalid-feedback">Tiene que aceptartar los terminos y condiciones para poder continuar</div></div>
                <button class="btn btn-primary w-100" type="submit"><i class="bi bi-person-plus" aria-hidden="true"></i> Crear cuenta</button>
            </form>

            <div class="auth-footer">Ya tienes una cuenta? <a routerLink="/login">Ingresar</a></div>
        </section>
    </main>
</div>
