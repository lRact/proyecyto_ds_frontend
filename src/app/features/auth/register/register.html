<div class="auth-body">
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="brand-icon">
                    <i class="bi bi-grid-1x2-fill" aria-hidden="true"></i>
                </span>
                <span>
                    <strong>Bienvenido</strong>
                    <small>Crea una cuenta</small>
                </span>
            </div>
            <div class="mb-4">
                <h1 class="h3 mb-1">Registro</h1>
                <p class="text-muted mb-0">Registrate para poder empezar a usar la plataforma.</p>
            </div>

            <div class="mb-3"><label class="form-label" for="registerName">Nombre completo</label><input
                class="form-control" id="registerName" type="text" required [(ngModel)]="nombre">
            </div>

            <div class="mb-3"><label class="form-label" for="registerEmail">Dirección de correo</label><input
                class="form-control" id="registerEmail" type="email" required [(ngModel)]="correo">
            </div>

            <div class="mb-3"><label class="form-label" for="registerPassword">Contraseña</label><input
                class="form-control" id="registerPassword" type="password" minlength="8" required [(ngModel)]="password">
            </div>

            <div class="mb-3"><label class="form-label" for="registerConfirmPassword">Confirmar contraseña</label><input
                class="form-control" id="registerConfirmPassword" type="password" minlength="8" required [(ngModel)]="confirmPassword">
            </div>

            <div class="mb-3">
                <label class = "form-label">¿Eres alumno o docente?</label>
                <div class = "d-flex gap-2">
                    <input type="radio" class="btn-check" name="userRole" id="roleAlumno" value="3" [(ngModel)]="id_rol" required>
                    <label class="btn btn-outline-primary w-50 py-2 d-flex align-items-center justify-content-center" for="roleAlumno">
                        <i class="bi bi-mortarboard fs-4 mb-1"></i>
                        <span>Alumno</span>
                    </label>
                    <input type="radio" class="btn-check" name="userRole" id="roleDocente" value="2" [(ngModel)]="id_rol" required>
                    <label class="btn btn-outline-primary w-50 py-2 d-flex align-items-center justify-content-center" for="roleDocente">
                        <i class="bi bi-person-workspace fs-4 mb-1"></i>
                        <span>Docente</span>
                    </label>
                </div>
            </div>

            @if(message()) {
                <div class = "alert alert-danger p-2 small mb-3">{{ message() }}</div>
            }

            <button class="btn btn-primary w-100" type="submit" (click) = "onSubmit()"><i class="bi bi-person-plus" aria-hidden="true"></i>
                Crear cuenta
            </button>

            <div class="auth-footer">Ya tienes una cuenta? <a href="/login">Ingresar</a></div>
        </section>
    </main>
</div>
