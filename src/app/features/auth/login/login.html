<div class="auth-body">
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="brand-icon">
                    <i class="bi bi-grid-1x2-fill" aria-hidden="true"></i>
                </span>
                <span>
                    <strong>Hola de nuevo</strong>
                    <small>Inicia sesión</small>
                </span>
            </div>

            <div class="mb-4">
                <h1 class="h3 mb-1">Login</h1>
                <p class="text-muted mb-0">Iniciar sesión en tu cuenta de alumno.</p>
            </div>

            <div class = 'invalid-feedback'></div>

            <div class="mb-3">
                <label class="form-label" for="loginEmail">Correo</label>
                <input class="form-control" id="loginEmail" type="email" required [(ngModel)]="email">
            </div>

            <div class="mb-3">
                <label class="form-label" for="loginPassword">Contraseña</label>
                <input class="form-control" id="loginPassword" type="password" minlength="8" required [(ngModel)]="password">
            </div>

            @if(message()) {
                <div class = "alert alert-danger p-2 small mb-3"> {{ message() }}</div>
            }

            <button class="btn btn-primary w-100" type="button" (click) = 'onSubmit()'>
                <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
                Ingresar
            </button>
            <div class="auth-footer">¿Eres nuevo? <a href="/register">Crear una cuenta</a></div>
        </section>
    </main>
</div>
