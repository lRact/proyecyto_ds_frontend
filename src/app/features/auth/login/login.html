<div class = "auth-body">
    <main class="auth-page">
        <section class="auth-card">
            <a class="auth-brand" href="index.html"><span class="brand-icon"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i></span><span><strong>Hola de nuevo</strong><small>Inicia sesión</small></span></a>
            <form class="needs-validation" novalidate>
                <div class="mb-4">
                    <h1 class="h3 mb-1">Login</h1>
                    <p class="text-muted mb-0">Iniciar sesión en tu cuenta de maestro, alumno o administrador.</p>
                </div>
                <div class="mb-3"><label class="form-label" for="loginEmail">Correo</label>
                    <input class="form-control" id="loginEmail" type="email" required>
                    <div class="invalid-feedback">Enter a valid email.</div></div>
                <div class="mb-3"><div class="d-flex justify-content-between"><label class="form-label" for="loginPassword">Contraseña</label></div><input class="form-control" id="loginPassword" type="password" minlength="6" required><div class="invalid-feedback">Password must be at least 6 characters.</div></div>
                <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Ingresar</button>
            </form>

            <div class="auth-footer">¿Eres nuevo? <a href="">Crear una cuenta</a></div>
        </section>
    </main>
</div>
