<main class="dashboard-content">
    <div class="container-fluid px-3 px-lg-4 py-4">
        <div class="page-heading mb-4">
            <h1 class="h3 mb-1">Mi Perfil</h1>
            <p class="text-muted">Actualiza tu información personal o cambia tu contraseña.</p>
        </div>

        <section class="row">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form (ngSubmit)="onSubmit()">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">ID:</label> <br>
                                <label class="form-label fw-semibold">{{ id }}</label>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre Completo</label>
                                <input type="text" class="form-control" [(ngModel)]="nombre" name="nombre" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Dirección de correo</label>
                                <input type="email" class="form-control" [(ngModel)]="correo" name="correo" required>
                            </div>

                            <hr class="my-4">

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Nueva Contraseña</label>
                                <input type="password" class="form-control" [(ngModel)]="password" name="password" minlength="8" placeholder="Déjalo en blanco si no quieres cambiarla">
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Confirmar Contraseña</label>
                                <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" minlength="8" placeholder="Déjalo en blanco si no quieres cambiarla">
                            </div>

                            @if (message()) {
                                <div class="alert alert-{{ message()?.tipo }} p-2 small mb-3">
                                    {{ message()?.texto }}
                                </div>
                            }

                            <div class="d-flex justify-content-end mt-4">
                                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
